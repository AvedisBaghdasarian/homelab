- name: Disable enterprise repos (no subscription)
  ansible.builtin.lineinfile:
    path: "/etc/apt/sources.list.d/{{ item }}"
    regexp: '^Enabled:'
    line: 'Enabled: false'
  loop: [pve-enterprise.sources, ceph.sources]

- name: Enable the pve-no-subscription repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: trixie
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

- name: Install packages
  ansible.builtin.apt:
    name:
      - msr-tools            # turbo fix
      - nfs-kernel-server    # cross-node backup exports
      - libgl1               # VM 102 uses vga: virtio-gl
      - libegl1
    update_cache: true
    cache_valid_time: 86400

- name: Authorize the workstation key (cluster-wide file)
  ansible.builtin.shell: |
    grep -qxF '{{ workstation_pubkey }}' /etc/pve/priv/authorized_keys && exit 0
    echo '{{ workstation_pubkey }}' >> /etc/pve/priv/authorized_keys && echo added
  register: wk
  changed_when: "'added' in wk.stdout"
